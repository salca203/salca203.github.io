<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kontakt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Styles -->
  <style>
    :root {
      --bg: #f5f5f7;
      --text: #1d1d1f;
      --sub: #6e6e73;
      --line: #d2d2d7;
      --accent: #0071e3;
      --card: #ffffff;
    }
    body.dark {
      --bg: #0f0f12;
      --text: #ffffff;
      --sub: #a1a1aa;
      --line: #2a2a2f;
      --accent: #4ea1ff;
      --card: #16161a;
    }
    * {box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;}
    body {margin:0;min-height:100vh;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:center;transition:background 0.3s ease,color 0.3s ease;}
    .card {width:100%;max-width:420px;background:var(--card);padding:32px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,0.08);transition:background 0.3s ease;}
    .top {display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
    h1 {margin:0;font-size:26px;font-weight:600;}
    .toggle {cursor:pointer;font-size:20px;}
    p {margin:8px 0 32px;color:var(--sub);font-size:15px;}
    input,textarea {width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);padding:12px 4px;margin-bottom:28px;font-size:15px;color:var(--text);outline:none;}
    textarea {resize:none;min-height:120px;}
    button {width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:14px;font-size:15px;font-weight:500;cursor:pointer;transition:transform 0.15s ease,box-shadow 0.15s ease;}
    button:hover {transform:translateY(-1px);box-shadow:0 10px 20px rgba(0,0,0,0.15);}
    .msg {text-align:center;margin-top:16px;font-size:15px;display:none;}
    .success {color:var(--accent);}
    .error {color:#ff3b30;}
    /* optional smooth fade */
    .msg {transition: opacity 0.3s ease;}
  </style>

  <!-- hCaptcha Script -->
  <script src="https://hcaptcha.com/1/api.js" async defer></script>
</head>
<body>

  <div class="card">
    <div class="top">
      <h1>Nachricht senden</h1>
      <div class="toggle" id="toggle">🌙</div>
    </div>

    <p>Schreib mir kurz was du loswerden willst</p>

    <form id="form" action="https://formspree.io/f/xdalooev" method="POST" onsubmit="return checkCaptcha();">
      <input type="email" name="email" placeholder="Deine Email" required>
      <textarea name="message" placeholder="Deine Nachricht" required></textarea>

      <!-- hCaptcha -->
      <div class="h-captcha" data-sitekey="69c09eba-c6b4-4c8c-8e6a-ca2cac36b67a
"></div>

      <button type="submit" id="btn">Senden</button>
    </form>

    <!-- Erfolg / Fehler Nachricht -->
    <div class="msg success" id="success">Danke, deine Nachricht wurde gesendet 😊</div>
    <div class="msg error" id="error">Senden fehlgeschlagen – bitte später versuchen</div>
  </div>

  <script>
    const body = document.body;
    const toggle = document.getElementById("toggle");
    const form = document.getElementById("form");
    const success = document.getElementById("success");
    const error = document.getElementById("error");
    const btn = document.getElementById("btn");

    // Light/Dark Mode Toggle
    toggle.onclick = () => {
      body.classList.toggle("dark");
      toggle.textContent = body.classList.contains("dark") ? "☀️" : "🌙";
    };

    // Check hCaptcha vor Absenden
    function checkCaptcha() {
      const response = hcaptcha.getResponse();
      if (!response) {
        alert("Bitte bestätige, dass du kein Roboter bist!");
        return false; // blockiert Senden
      }
      // Zeige Ladezustand
      btn.textContent = "Senden ...";
      btn.disabled = true;

      // kleine Verzögerung für User Feedback
      setTimeout(() => {
        btn.textContent = "Senden";
        btn.disabled = false;
        success.style.display = "block"; // Formspree zeigt die Mail
      }, 1000);

      return true; // Formular wird gesendet
    }
  </script>

</body>
</html>
