<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Nachricht senden</title>
</head>
<body>

  <h1>Schreib mir</h1>

  <form action="https://formspree.io/f/xdalooev" method="POST">

    <label>
      Deine Email
      <br>
      <input type="email" name="email" required>
    </label>

    <br><br>

    <label>
      Deine Nachricht
      <br>
      <textarea name="message" rows="6" required></textarea>
    </label>

    <br><br>

    <button type="submit">Absenden</button>

  </form>

</body>
</html>
