
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Feedback | Meine Website</title>
  <meta name="description" content="Sende uns deine Verbesserungsvorschläge und dein Feedback.">

  <style>
    :root {
      --background: #101116;
      --surface: #191b24;
      --surface2: #222530;
      --text: #ffffff;
      --muted: #a1a5b3;
      --accent: #8977ff;
      --border: #303340;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 22px 7%;
      border-bottom: 1px solid var(--border);
    }

    header a {
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 55px 18px;
    }

    .feedback-card {
      width: 100%;
      max-width: 550px;
      padding: 35px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 15px 50px #0004;
    }

    .icon {
      width: 55px;
      height: 55px;
      display: grid;
      place-items: center;
      background: #8977ff20;
      border-radius: 15px;
      font-size: 27px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 12px;
    }

    .description {
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    .optional {
      color: var(--muted);
      font-weight: normal;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface2);
      color: white;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border .2s;
    }

    input:focus,
    textarea:focus {
      border-color: var(--accent);
    }

    input::placeholder,
    textarea::placeholder {
      color: #858a99;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.5;
    }

    .captcha-container {
      margin: 22px 0;
      overflow-x: auto;
    }

    button {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      border: none;
      border-radius: 11px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    #status {
      display: none;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    #status.success {
      display: block;
      background: #153d2a;
      color: #a5efc1;
    }

    #status.error {
      display: block;
      background: #482326;
      color: #ffb5b5;
    }

    footer {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
    }

    footer a:hover {
      color: white;
    }

    @media (max-width: 600px) {
      main {
        padding: 30px 15px;
      }

      .feedback-card {
        padding: 25px 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Zurück zur Website</a>
  </header>

  <main>

    <section class="feedback-card">

      <div class="icon">💡</div>

      <h1>Dein Feedback</h1>

      <p class="description">
        Hast du Verbesserungsvorschläge, Ideen oder ist dir
        ein Fehler aufgefallen? Lass es uns wissen!
        Jede Nachricht hilft uns, die Website zu verbessern.
      </p>

      <form id="feedbackForm">

        <!-- Web3Forms -->
        <input
          type="hidden"
          name="access_key"
          value="b4cd7dd2-e76c-4ca8-9dd8-c75a3c2ed893"
        >

        <input
          type="hidden"
          name="subject"
          value="Neues Feedback von der Website"
        >

        <input
          type="hidden"
          name="from_name"
          value="Website Feedback"
        >

        <!-- Honeypot -->
        <input
          type="checkbox"
          name="botcheck"
          style="display:none"
          tabindex="-1"
          autocomplete="off"
        >

        <div class="field">
          <label for="name">
            Name <span class="optional">(optional)</span>
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Wie heißt du?"
            maxlength="80"
          >
        </div>

        <div class="field">
          <label for="email">
            E-Mail <span class="optional">(optional)</span>
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Deine E-Mail-Adresse"
            maxlength="254"
          >
        </div>

        <div class="field">
          <label for="message">Deine Nachricht *</label>

          <textarea
            id="message"
            name="message"
            placeholder="Was können wir verbessern? Ist dir ein Fehler aufgefallen?"
            required
            minlength="5"
            maxlength="3000"
          ></textarea>
        </div>

        <!-- hCaptcha -->
        <div class="captcha-container">
          <div
            class="h-captcha"
            data-captcha="true"
            data-lang="de"
          ></div>
        </div>

        <button type="submit" id="submitButton">
          Vorschlag absenden →
        </button>

        <div id="status" role="status" aria-live="polite"></div>

      </form>

    </section>

  </main>

  <footer>
    <a href="index.html">Startseite</a>
    &nbsp; · &nbsp;
    Feedback
    &nbsp; · &nbsp;
    Vielen Dank für deine Unterstützung!
  </footer>

  <!-- Web3Forms hCaptcha Script -->
  <script src="https://web3forms.com/client/script.js" async defer></script>

  <script>
    const form = document.getElementById("feedbackForm");
    const button = document.getElementById("submitButton");
    const status = document.getElementById("status");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      status.className = "";
      status.style.display = "none";

      button.disabled = true;
      button.textContent = "Wird gesendet ...";

      try {

        const formData = new FormData(form);

        const response = await fetch(
          "https://api.web3forms.com/submit",
          {
            method: "POST",
            body: formData
          }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.message || "Nachricht konnte nicht gesendet werden."
          );
        }

        form.reset();

        if (window.hcaptcha) {
          window.hcaptcha.reset();
        }

        status.textContent =
          "✓ Vielen Dank für dein Feedback! Deine Nachricht wurde erfolgreich übermittelt.";

        status.className = "success";

      } catch (error) {

        status.textContent =
          "Leider ist ein Fehler aufgetreten. Bitte überprüfe das CAPTCHA und versuche es erneut.";

        status.className = "error";

      } finally {

        button.disabled = false;
        button.innerHTML = "Vorschlag absenden →";

      }

    });
  </script>

</body>
</html>
