<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kontakt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f0f12;
      color: #ffffff;
    }

    .wrapper {
      width: 100%;
      max-width: 420px;
      padding: 32px;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 28px;
      font-weight: 600;
    }

    p {
      margin-bottom: 32px;
      color: #b5b5c0;
      font-size: 15px;
    }

    input,
    textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid #3a3a44;
      padding: 12px 4px;
      margin-bottom: 28px;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input::placeholder,
    textarea::placeholder {
      color: #6f6f7a;
    }

    input:focus,
    textarea:focus {
      border-color: #ffffff;
    }

    textarea {
      resize: none;
      min-height: 120px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: white;
      color: black;
      border: none;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.85;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #6f6f7a;
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <h1>Nachricht senden</h1>
    <p>Schreib mir kurz was du loswerden willst</p>

    <form action="https://formspree.io/f/xdalooev" method="POST">

      <input
        type="email"
        name="email"
        placeholder="Deine Email"
        required
      >

      <textarea
        name="message"
        placeholder="Deine Nachricht"
        required
      ></textarea>

      <button type="submit">Senden</button>

    </form>

    <div class="footer">
      Antwort kommt per Email
    </div>
  </div>

</body>
</html>
