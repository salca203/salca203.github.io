<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Claas Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Willkommen auf meiner Website</h1>
  <div id="time"></div>

  <button id="darkToggle">Darkmode wechseln</button>
</header>

<main>

<section class="card">
  <h2>Klickzähler</h2>
  <p>Klicks: <span id="clickCount">0</span></p>
  <button id="clickBtn">Klick mich</button>
</section>

<section class="card">
  <h2>Mini Spiel</h2>
  <p>Klicke so schnell du kannst</p>
  <button id="gameBtn">Punkt holen</button>
  <p>Punkte: <span id="gameScore">0</span></p>
</section>

<section class="card">
  <h2>Nachricht senden</h2>

  <form id="contactForm">
    <input type="text" id="name" placeholder="Dein Name" required>
    <textarea id="message" placeholder="Deine Nachricht" required></textarea>
    <button type="submit">Absenden</button>
  </form>

  <p id="formInfo"></p>
</section>

</main>

<footer>
  <a href="impressum.html">Impressum</a>
</footer>

<script src="script.js"></script>

</body>
</html>
