<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kontakt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #f5f5f7;
      --text: #1d1d1f;
      --sub: #6e6e73;
      --line: #d2d2d7;
      --accent: #0071e3;
      --card: #ffffff;
    }

    body.dark {
      --bg: #0f0f12;
      --text: #ffffff;
      --sub: #a1a1aa;
      --line: #2a2a2f;
      --accent: #4ea1ff;
      --card: #16161a;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 26px;
      margin: 0;
    }

    .toggle {
      cursor: pointer;
      font-size: 20px;
    }

    p {
      margin-top: 8px;
      margin-bottom: 32px;
      color: var(--sub);
      font-size: 15px;
    }

    input,
    textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      padding: 12px 4px;
      margin-bottom: 28px;
      font-size: 15px;
      color: var(--text);
      outline: none;
    }

    textarea {
      resize: none;
      min-height: 120px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      cursor: pointer;
    }

    .msg {
      text-align: center;
      margin-top: 16px;
      font-size: 15px;
      display: none;
    }

    .success {
      color: var(--accent);
    }

    .error {
      color: #ff3b30;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="top">
      <h1>Nachricht senden</h1>
      <div class="toggle" id="toggle">🌙</div>
    </div>

    <p>Schreib mir kurz was du loswerden willst</p>

    <form id="form">
      <input type="email" name="email" placeholder="Deine Email" required>
      <textarea name="message" placeholder="Deine Nachricht" required></textarea>
      <button id="btn" type="submit">Senden</button>
    </form>

    <div class="msg success" id="success">
      Danke deine Nachricht wurde gesendet 😊
    </div>

    <div class="msg error" id="error">
      Senden fehlgeschlagen bitte später nochmal versuchen
    </div>
  </div>

  <script>
    const body = document.body;
    const toggle = document.getElementById("toggle");
    const form = document.getElementById("form");
    const success = document.getElementById("success");
    const error = document.getElementById("error");
    const btn = document.getElementById("btn");

    toggle.onclick = () => {
      body.classList.toggle("dark");
      toggle.textContent = body.classList.contains("dark") ? "☀️" : "🌙";
    };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      success.style.display = "none";
      error.style.display = "none";
      btn.textContent = "Senden ...";

      try {
        const res = await fetch("https://formspree.io/f/xdalooev", {
          method: "POST",
          body: new FormData(form),
          headers: { "Accept": "application/json" }
        });

        if (res.ok) {
          form.reset();
          success.style.display = "block";
        } else {
          error.style.display = "block";
        }
      } catch {
        error.style.display = "block";
      }

      btn.textContent = "Senden";
    });
  </script>

</body>
</html>
