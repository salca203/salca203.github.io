
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kontakt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #f5f5f7;
      --text: #1d1d1f;
      --sub: #6e6e73;
      --line: #d2d2d7;
      --accent: #0071e3;
      --card: #ffffff;
    }

    body.dark {
      --bg: #0f0f12;
      --text: #ffffff;
      --sub: #a1a1aa;
      --line: #2a2a2f;
      --accent: #4ea1ff;
      --card: #16161a;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.3s;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
    }

    .toggle {
      cursor: pointer;
      font-size: 20px;
    }

    p {
      color: var(--sub);
      font-size: 15px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 8px;
    }

    input, textarea, select {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      padding: 12px 4px;
      margin-bottom: 24px;
      font-size: 15px;
      color: var(--text);
      outline: none;
    }

    select option {
      background: var(--card);
      color: var(--text);
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 130px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .captcha {
      margin-bottom: 22px;
      overflow: hidden;
    }

    .msg {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      display: none;
    }

    .success {
      color: #16a34a;
    }

    .error {
      color: #ff3b30;
    }

    /* Verstecktes Bot Feld */
    .honeypot {
      position: absolute;
      left: -9999px;
    }
  </style>

  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
</head>

<body>

  <div class="card">

    <div class="top">
      <h1>Nachricht senden</h1>
      <div class="toggle" id="toggle">🌙</div>
    </div>

    <p>
      Feedback, Fragen oder Probleme?
      Ich freue mich über deine Nachricht.
    </p>

    <form id="form"
      action="https://formspree.io/f/xdalooev"
      method="POST">

      <label for="type">Worum geht es?</label>

      <select name="Kategorie" id="type" required>
        <option value="" disabled selected>Bitte auswählen</option>
        <option value="Feedback">Feedback</option>
        <option value="Fehler melden">Fehler melden</option>
        <option value="Verbesserungsvorschlag">Verbesserungsvorschlag</option>
        <option value="Kontakt">Kontakt</option>
        <option value="Sonstiges">Sonstiges</option>
      </select>

      <label for="email">Deine E-Mail Adresse</label>

      <input
        type="email"
        name="email"
        id="email"
        placeholder="name@beispiel.de"
        required
      >

      <label for="message">Deine Nachricht</label>

      <textarea
        name="message"
        id="message"
        placeholder="Was möchtest du mir mitteilen?"
        minlength="5"
        maxlength="3000"
        required
      ></textarea>

      <!-- Honeypot gegen Bots -->
      <div class="honeypot" aria-hidden="true">
        <label for="website">Website</label>
        <input
          type="text"
          name="_gotcha"
          id="website"
          tabindex="-1"
          autocomplete="off"
        >
      </div>

      <!-- hCaptcha -->
      <div class="captcha">
        <div class="h-captcha"
          data-sitekey="69c09eba-c6b4-4c8c-8e6a-ca2cac36b67a">
        </div>
      </div>

      <button type="submit" id="btn">Nachricht senden</button>

    </form>

    <div class="msg success" id="success">
      Danke! Deine Nachricht wurde erfolgreich gesendet.
    </div>

    <div class="msg error" id="error">
      Das Senden ist fehlgeschlagen. Bitte versuche es erneut.
    </div>

  </div>

  <script>
    const body = document.body;
    const toggle = document.getElementById("toggle");
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const success = document.getElementById("success");
    const error = document.getElementById("error");

    // Dark Mode
    toggle.onclick = () => {
      body.classList.toggle("dark");

      toggle.textContent =
        body.classList.contains("dark") ? "☀️" : "🌙";
    };

    // Formular absenden
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      success.style.display = "none";
      error.style.display = "none";

      // Honeypot Kontrolle
      if (document.getElementById("website").value !== "") {
        return;
      }

      // CAPTCHA Kontrolle
      if (!hcaptcha.getResponse()) {
        alert("Bitte bestätige das CAPTCHA.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Wird gesendet ...";

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("Senden fehlgeschlagen");
        }

        success.style.display = "block";
        form.reset();
        hcaptcha.reset();

      } catch (err) {
        error.style.display = "block";
        hcaptcha.reset();

      } finally {
        btn.disabled = false;
        btn.textContent = "Nachricht senden";
      }
    });
  </script>

</body>
</html>
